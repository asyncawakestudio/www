name: ci

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.3
      - name: Setup Node.js
        uses: volta-cli/action@v5.0.0
      - name: Install third party dependencies
        run: npm ci
      # TODO: reable after all vulns patched
      # - name: Check third party vulnerabilities
      #   run: npm audit
      - name: Check for lint warnings/errors
        run: npm run lint
      - name: Check for build errors
        run: npm run build
      - name: Run tests
        run: npm run test
      - name: Report Coverage
        if: always()
        uses: davelosert/vitest-coverage-report-action@v2.12.0
